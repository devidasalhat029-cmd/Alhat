{% extends "baseofhtml.html" %}

{% block title %}AI Plant Disease Detection{% endblock %}

{% block content %}

<style>

body{
    background:#eef8ee;
}

.box{
    width:450px;
    margin:50px auto;
    background:white;
    padding:35px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,.15);
}

h1{
    color:#198754;
    margin-bottom:25px;
}

input[type=file]{
    width:100%;
    padding:12px;
    border:2px dashed #198754;
    border-radius:10px;
    cursor:pointer;
    margin:20px 0;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#198754;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#146c43;
    transform:scale(1.03);
}

img{
    width:120px;
    margin-bottom:15px;
}

</style>

<div class="box">

<img src="{{ url_for('static', filename='images/leaf.png') }}">

<h1>🌿 AI Plant Disease Detection</h1>

<form action="/disease" method="POST" enctype="multipart/form-data">

<input
type="file"
name="leaf"
accept="image/*"
required>

<button type="submit">

🔍 Detect Disease

</button>

</form>

</div>

{% endblock %}
