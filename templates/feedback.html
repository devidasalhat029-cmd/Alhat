{% extends "baseofhtml.html" %}

{% block title %}Feedback{% endblock %}

{% block content %}

<style>

body{
    background:linear-gradient(135deg,#e8f5e9,#f1f8e9);
}

/* Feedback Box */

.feedback-box{

    width:90%;
    max-width:600px;
    margin:50px auto;
    background:white;
    padding:35px;
    border-radius:25px;
    box-shadow:0 10px 30px rgba(0,0,0,0.15);

}


.feedback-box h1{

    text-align:center;
    color:#198754;
    margin-bottom:25px;

}


.input-box{

    margin-bottom:20px;

}


.input-box label{

    font-weight:bold;
    color:#198754;

}


.input-box input,
.input-box textarea{

    width:100%;
    padding:14px;
    margin-top:8px;
    border-radius:12px;
    border:2px solid #d8e8d8;
    outline:none;
    font-size:16px;

}


.input-box input:focus,
.input-box textarea:focus{

    border-color:#198754;

}



button{

    width:100%;
    padding:15px;
    border:none;
    border-radius:15px;
    background:#198754;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;

}


button:hover{

    background:#146c43;
    transform:scale(1.03);

}



/* Thank You Modal */


.modal{

display:none;
position:fixed;
z-index:1000;
left:0;
top:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.5);

}



.modal-content{

background:white;
width:350px;
margin:15% auto;
padding:35px;
border-radius:25px;
text-align:center;
animation:popup .4s;

}



@keyframes popup{

from{
transform:scale(0);
}

to{
transform:scale(1);
}

}



.modal-content h2{

color:#198754;
font-size:30px;

}


.modal-content p{

font-size:18px;

}



.emoji{

font-size:50px;

}


.close-btn{

margin-top:20px;
background:#198754;
padding:12px 30px;
border-radius:15px;
color:white;
display:inline-block;
cursor:pointer;

}


</style>



<div class="feedback-box">


<h1>
🌱 Agro Monitor Feedback
</h1>



<form action="/feedback" method="POST" onsubmit="showPopup()">


<div class="input-box">

<label>
👤 Name
</label>

<input 
type="text"
name="name"
placeholder="Enter your name"
required>

</div>



<div class="input-box">

<label>
📧 Email
</label>

<input 
type="email"
name="email"
placeholder="Enter email"
required>

</div>



<div class="input-box">

<label>
💬 Feedback
</label>


<textarea
name="message"
rows="5"
placeholder="Write your feedback..."
required></textarea>


</div>



<button type="submit">

🚀 Submit Feedback

</button>



</form>


</div>



<!-- Thank You Popup -->


<div id="thankModal" class="modal">


<div class="modal-content">


<div class="emoji">
🎉🎉
</div>


<h2>
Thank You!
</h2>


<p>
Your feedback has been submitted successfully.
<br>
We appreciate your valuable suggestion 🌱
</p>


<div class="close-btn"
onclick="closePopup()">

OK

</div>


</div>


</div>




<script>


function showPopup(){

document.getElementById("thankModal").style.display="block";

}



function closePopup(){

document.getElementById("thankModal").style.display="none";

}


</script>


{% endblock %}
