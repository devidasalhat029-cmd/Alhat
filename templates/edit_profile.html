{% extends "baseofhtml.html" %}

{% block content %}

<style>

body{
    background:#eef7e8;
}


.edit-container{

    width:500px;
    margin:40px auto;

}


.edit-card{

    background:white;

    padding:35px;

    border-radius:25px;

    box-shadow:0 10px 30px rgba(46,125,50,0.25);

}



.title{

    text-align:center;

    color:#2e7d32;

    font-weight:800;

    margin-bottom:25px;

}



.profile-preview{

    width:120px;

    height:120px;

    border-radius:50%;

    object-fit:cover;

    border:5px solid #43a047;

    display:block;

    margin:15px auto;

}



label{

    font-weight:bold;

    color:#33691e;

    margin-top:10px;

}



.form-control{

    border-radius:12px;

    padding:12px;

}



.update-btn{

    width:100%;

    margin-top:25px;

    padding:13px;

    border:none;

    border-radius:25px;

    background:#2e7d32;

    color:white;

    font-size:18px;

    font-weight:bold;

}



.update-btn:hover{

    background:#1b5e20;

}

</style>



<div class="edit-container">


<div class="edit-card">



<h2 class="title">
✏️ Edit Farmer Profile
</h2>




<img src="{{ url_for('static', filename='uploads/' + farmer.photo) }}"
class="profile-preview">





<form method="POST"
enctype="multipart/form-data">



<label>Name</label>

<input type="text"
name="name"
class="form-control"
value="{{ farmer.name }}"
required>




<label>Mobile</label>

<input type="text"
name="mobile"
class="form-control"
value="{{ farmer.mobile }}"
required>





<label>Village</label>

<input type="text"
name="village"
class="form-control"
value="{{ farmer.village }}"
required>





<label>Username</label>

<input type="text"
name="username"
class="form-control"
value="{{ farmer.username }}"
required>





<label>Change Profile Photo</label>

<input type="file"
name="photo"
class="form-control"
accept="image/*">





<button class="update-btn">

💾 Update Farmer

</button>



</form>



</div>


</div>


{% endblock %}
