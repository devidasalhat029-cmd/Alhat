{% extends "baseofhtml.html" %}

{% block title %}
Dashboard
{% endblock %}

{% block content %}

<div class="container-fluid mt-4">

    <div class="row g-4">

        <div class="col-md-3">
            <div class="card text-white bg-success shadow-lg border-0 rounded-4">
                <div class="card-body">
                    <h5><i class="fa-solid fa-users"></i> Total Farmers</h5>
                    <h2>{{ total_farmers }}</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card text-white bg-primary shadow-lg border-0 rounded-4">
                <div class="card-body">
                    <h5><i class="fa-solid fa-seedling"></i> Total Crops</h5>
                    <h2>{{ total_crops }}</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card text-dark bg-warning shadow-lg border-0 rounded-4">
                <div class="card-body">
                    <h5><i class="fa-solid fa-temperature-three-quarters"></i> Temperature</h5>
                    <h2>31°C</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card text-white bg-danger shadow-lg border-0 rounded-4">
                <div class="card-body">
                    <h5><i class="fa-solid fa-faucet-drip"></i> Motor</h5>
                    <h2>ON</h2>
                </div>
            </div>
        </div>

    </div>

    <div class="card shadow-lg border-0 rounded-4 mt-4">
        <div class="card-body">
            <h4 class="text-success">🌦️ Weather Information</h4>
            <p>Temperature : 31°C</p>
            <p>Humidity : 72%</p>
            <p>Soil Moisture : 48%</p>
        </div>
    </div>

</div>

<style>
.card{
    transition:0.3s;
}
.card:hover{
    transform:translateY(-8px);
}
</style>

{% endblock %}
