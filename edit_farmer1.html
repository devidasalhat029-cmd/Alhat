{% extends "baseofhtml.html" %}

{% block title %}Edit Farmer{% endblock %}

{% block content %}

<div class="container mt-5">

<div class="card shadow-lg p-4">

<h2 class="text-center mb-4">
✏️ Edit Farmer
</h2>

<form method="POST">

<div class="mb-3">
<label>Name</label>
<input
type="text"
name="name"
class="form-control"
value="{{ farmer.name }}"
required>
</div>

<div class="mb-3">
<label>Mobile</label>
<input
type="text"
name="mobile"
class="form-control"
value="{{ farmer.mobile }}"
required>
</div>

<div class="mb-3">
<label>Village</label>
<input
type="text"
name="village"
class="form-control"
value="{{ farmer.village }}"
required>
</div>

<div class="text-center">

<button
type="submit"
class="btn btn-success">

💾 Update Farmer

</button>

<a
href="/admin_dashboard"
class="btn btn-secondary">

❌ Cancel

</a>

</div>

</form>

</div>

</div>

{% endblock %}
